name: Run Pytest Tests

on:
  workflow_dispatch: #手动触发
  push:
    branches: [master, main, framework-practice]
  pull_request:
    branches: [master, main]

# 授予 GITHUB_TOKEN 写入 contents 的权限（用于推送 gh-pages）
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-playwright allure-pytest
          playwright install chromium

      - name: Run Pytest with Allure results
        run: |
          pytest tests/ -v --alluredir=allure-results \
            --ignore=tests/test_generate_baseline.py \
            --ignore=tests/test_visual_regression.py \
            --ignore=tests/test_item_detail.py \
            --ignore=tests/test_login_data_driven.py \
            --ignore=tests/test_sorting.py

      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz -C /opt
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/local/bin/allure

      - name: Generate Allure Report
        run: |
          allure generate allure-results -o allure-report --clean

      - name: Upload Allure report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/

      # 🔔 测试失败时发送通知
      - name: Send failure notification
        if: failure()
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK_URL }}
        run: |
          # 构建失败消息
          MESSAGE="## 🚨 测试流水线失败\n\n- **仓库**: ${{ github.repository }}\n- **分支**: ${{ github.ref_name }}\n- **提交者**: ${{ github.actor }}\n- **Commit**: ${{ github.sha }}\n- **Actions 链接**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # 发送到企业微信（如果配置了 webhook）
          if [ -n "$WECOM_WEBHOOK" ]; then
            curl -X POST -H "Content-Type: application/json" \
              -d "{\"msgtype\": \"markdown\", \"markdown\": {\"content\": \"$MESSAGE\"}}" \
              "$WECOM_WEBHOOK"
            echo "企业微信通知已发送"
          fi

  deploy-report:
    needs: test
    # 仅在推送到 framework-practice 分支时部署（可根据需要修改）
    if: github.ref == 'refs/heads/framework-practice'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: 'gh-pages'
          path: 'gh-pages'

      - name: Download Allure report artifact
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: 'allure-report'

      - name: Sync report to gh-pages
        run: |
          rm -rf gh-pages/*
          cp -r allure-report/* gh-pages/
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Allure report from branch ${{ github.ref_name }}"
          git push origin gh-pages

      