[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --html=reports/report.html
    --self-contained-html
    --cov=pages
    --cov-report=html:reports/coverage
    --cov-report=term-missing
markers =
    login: Login tests
    search: Search tests
    cart: Cart tests